<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Cart</title>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
        body {
    font-family: 'poppins', sans-serif;
    margin: 0;
}


.header {
    display: flex;
    align-items: center;
    padding: 14px 30px;
    color: #5a3e36;
    position: sticky;
    top: 0;
    z-index: 60;
    height: 50px;
    padding: 0.5rem;
    background-color: #f8afc3;
    justify-content: space-between;
}

.headmain {
    display: flex;
    height: 50px;
    padding: 0.5rem;
    background-color: #f8afc3;
    position: sticky;
    top: 0;
    z-index: 60;
}

.btn_one i {
    color: #5a3e36;
    font-size: 25px;
    font-weight: 700;
    position: absolute;
    left: 16px;
    line-height: 60px;
    cursor: pointer;
    transition: all 0.3s linear;
    letter-spacing: 1px;
}

.sidebar_menu {
    position: fixed;
    left: -300px;
    height: 100vh;
    width: 300px;
    background-color: white;
    box-shadow: 0 0 6px #f8afc3;
    transition: all 0.3s linear;
}

.sidebar_menu .logo {
    position: absolute;
    width: 100%;
    line-height: 60px;
    height: 60px;
    box-shadow: 0 2px 4px #f8afc3;


}

.sidebar_menu .logo a {
    position: absolute;
    left: 50px;
    color: #5a3e36;
    text-decoration: none;
    font-size: 30px;
    font-weight: 500;

}

.sidebar_menu .btn_two i {
    color: black;
    font-size: 25px;
    position: absolute;
    left: 270px;
    line-height: 5px;
    /* opacity: 0; */
    cursor: pointer;
    transition: all 0.3s linear;

}

.sidebar_menu .menu {
    text-decoration: none;
    color: black;
    width: 100%;
    position: absolute;
    top: 80px;
}

.sidebar_menu .menu li {
    margin-top: 6px;
    padding: 14px 20px;
    list-style: none;
}

.sidebar_menu .menu i,
a {
    color: #5a3e36;
    text-decoration: none;
    font-size: 20px;
}

.sidebar_menu .menu i {
    padding: 8px;
}

.sidebar_menu .social_media {
    color: rgba(255, 255, 255, 0.5);
    opacity: 0.5;
    position: absolute;
    left: 25px;
    bottom: 50px;
}

.sidebar_menu .social_media i {
    color: black;
    opacity: 0.5;
    padding: 0 1px;
}

#check {
    display: none;
}

.sidebar_menu .menu li:hover {
    box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
}

.btn_one i:hover {
    font-size: 30px;
}

.btn_two i:hover {
    font-size: 25px;
}

.sidebar_menu .social_media i:hover {
    opacity: 1;
    transform: scale(1.5);
}

#check:checked~.sidebar_menu {
    left: 0;
}

#check:checked~.btn_one i {
    opacity: 0;
}

.container{
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background:white;
            border-radius: 10px;
            box-shadow: 0 0 10px ;
            display: flex;
            gap: 30px;
        }

        .product-img{
            flex: 1;
           
        }

        .product-img img{
            width: 100%;
            border-radius: 10px;
            height: 450px;
        }

        .product-details{
            flex: 1.3;
        }

        h2{
            margin: 0 0 10px;
        }

        .price{
            font-size: 22px;
            font-weight: bold;
            color: #5a3e36 ;
            margin-bottom: 15px;
        }

        .desc{
            color:  #5a3e36;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .qty-box{
            margin-bottom: 20px;
        }

        .qty-box label{
            font-weight: bold;
        }

        .qty-box input{
            width: 60px;
            padding: 6px;
            font-size: 16px;
            margin-left: 10px;
            border-radius: 5px;
            background-color:  white;
            border: 1px solid #f8afc3;
        }

        .btn{
            display: inline-block;
            padding: 12px 20px;
            background:  #f8afc3;
            color: #5a3e36;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover{
            background: #d67f96;
        }

        footer {
    width: 100%;
    text-align: center;
    margin-top: 40px;
}

.footer-top {
    border-top: 1px solid pink;
    background-color: white;
    padding: 30px 20px 20px;
}

.footer-logo {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
    color: #e75480;
}

.footer-tital {
    margin: 5px 0 15px;
    font-size: 15px;
    color: #444;
}

.footer-social a img {
    width: 28px;
    margin: 0 8px;
    transition: transform 0.3s;
}

.footer-social a img:hover {
    transform: scale(1.2);
}

.footer-copy {
    margin-top: 15px;
    font-size: 14px;
    color: #555;
}

.footer-bottom {
    background: url('foot.jpeg') repeat-x;
    background-size: contain;
    height: 200px;
}
    </style>

</head>
<body>
<header class="header">
      <div class="headmain">
 <input type="checkbox" id="check" />
      <div class="btn_one">
        <label for="check" >
          <i class="fa-solid fa-bars"></i>
        </label> 
      </div>
     <div class="sidebar_menu">
        <div class="logo">
          <a href="#">yadavthreads</a>
        </div>
<div class="btn_two">
          <label for="check">
            <i class="fa-solid fa-xmark"></i>
          </label>
        </div>

        <div class="menu">
          <ul>
            <li>
              
              <a href="#">home</a>
            </li>
            <li>
              
              <a href="#">Collection</a>
            </li>
            <li>
              
              <a href="#">new</a>
            </li>
            <li>
              
              <a href="#">contact</a>
            </li>
        </div>

        <div class="social_media">
          <ul>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
          </ul>
        </div>
      </div> 
     </div>
    
  
    <div class="brand">YadavThreads</div>
   
     <div class="cart">
      <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
     </div>
  </header>
    <div class="container">
        
        <div class="product-img">
            <img src="dress 1.AVIF" alt="Product">
        </div>

        <div class="product-details">
            <p class="price">₹2000</p>
            <p class="desc">
                This is a high-quality medicine used for daily health support.
                Fully safe and doctor recommended.
            </p>

            <div class="qty-box">
                <label>Quantity:</label>
                <input type="number" min="1" value="1">
            </div>

            <a href="#" class="btn">Add to Cart</a>
        </div>

    </div>
<footer class="footer">
    <div class="footer-top">
      <h3 class="footer-logo">YadavThreads</h3>
      <p class="footer-tital">A stylesh and cute outfits just for my cuties</p>


      <div class="footer-social">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"> </a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733558.png"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" ></a>
      </div>
    </div>
    <div class="footer-bottom"></div>
  </footer>
</body>
</html>
