
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | YadavThreads</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />


  <link rel="stylesheet" href="style.css" />

  <style>
    
    .cart-page {
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .cart-box {
      text-align: center;
      max-width: 420px;
      width: 100%;
      padding: 40px 24px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .cart-box h2 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #5a3e36;
    }

    .cart-box p {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 24px;
    }

    .cart-count {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .start-btn {
      padding: 12px 26px;
      border-radius: 30px;
      border: none;
      background: #e75480;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
    width: 100%;
    text-align: center;
    margin-top: 40px;
    }

   .footer-top {
    border-top: 1px solid pink;
    background-color: white;
    padding: 30px 20px 20px;
    }

   .footer-logo {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
    color: #e75480;
  }

  .footer-tital {
    margin: 5px 0 15px;
    font-size: 15px;
    color: #444;
  }

.footer-links {
    text-decoration: none;
    padding: 0;
    margin: 10px 0;
}

.footer-links li {
    display: inline;
    margin: 0 10px;
}

.footer-links a {
    color: #e75480;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

.footer-links a:hover {
    color: #e75480;
}

.footer-social a img {
    width: 28px;
    margin: 0 8px;
    transition: transform 0.3s;
}

.footer-social a img:hover {
    transform: scale(1.2);
}

.footer-copy {
    margin-top: 15px;
    font-size: 14px;
    color: #555;
}

.footer-bottom {
    background: url('foot.jpeg') repeat-x;
    background-size: contain;
    height: 200px;
}
    .start-btn:hover {
      transform: translateY(-3px);
    }

    @media (max-width: 480px) {
      .cart-box {
        padding: 30px 18px;
      }

      .cart-box h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="headmain">
    <input type="checkbox" id="check" />

    <div class="btn_one">
      <label for="check">
        <i class="fa-solid fa-bars"></i>
      </label>
    </div>

    <div class="sidebar_menu">
      <div class="logo">
        <a href="index.html">YadavThreads</a>
      </div>

      <div class="btn_two">
        <label for="check">
          <i class="fa-solid fa-xmark"></i>
        </label>
      </div>

      <div class="menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="collection.html">Collection</a></li>
          <li><a href="new.html">New</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>

      <div class="social_media">
        <ul>
          <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
          <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="brand">YadavThreads</div>

  <div class="cart">
    <a href="cart.html">
      <i class="fa-solid fa-cart-shopping"></i>
    </a>
  </div>
</header>
<section class="cart-page">
  <div class="cart-box">
    <h2>Your Cart</h2>
    <p>No items in your cart</p>
    <div class="cart-count">0 items selected</div>

    <button class="start-btn" onclick="window.location.href='index.html'">
      Start Shopping
    </button>
  </div>
</section>

<footer class="footer">
    <div class="footer-top">
      <h3 class="footer-logo">YadavThreads</h3>
      <p class="footer-tital">A stylesh and cute outfits just for my cuties</p>

      <div class="footer-social">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"> </a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733558.png"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" ></a>
      </div>
    </div>
    <div class="footer-bottom"></div>
  </footer>

</body>
</html>
